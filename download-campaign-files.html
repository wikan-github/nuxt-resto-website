'app/composables/useWhatsApp.ts': `export function useWhatsApp() {
  const config = useRuntimeConfig()
  const phone = config.public.whatsappPhone

  function buildClaimUrl(opts: {
    offerTitle?: string
    utmSource?: string
    locale?: string
  }) {
    const isId = opts.locale === 'id'

    const greeting = isId
      ? 'Halo Tropical View Ubud, saya baru selesai dari Monkey Forest.'
      : 'Hi Tropical View Ubud, I just finished the Monkey Forest.'

    const claimLine = opts.offerTitle
      ? (isId
          ? \`Saya ingin klaim: \${opts.offerTitle}.\`
          : \`I'd like to claim: \${opts.offerTitle}.\`)
      : ''

    const srcLine = opts.utmSource ? \`(src: \${opts.utmSource})\` : ''

    const message = [greeting, claimLine, srcLine].filter(Boolean).join('\\n')

    return \`https://wa.me/\${phone}?text=\${encodeURIComponent(message)}\`
  }

  return { buildClaimUrl }
}
`,

'app/composables/useOpenNow.ts': `export function useOpenNow(hours = { open: '07:00', close: '22:00' }) {
  const now = ref(new Date())

  onMounted(() => {
    setInterval(() => (now.value = new Date()), 60_000)
  })

  const isOpen = computed(() => {
    const [openHour, openMin] = hours.open.split(':').map(Number)
    const [closeHour, closeMin] = hours.close.split(':').map(Number)
    const currentMinutes = now.value.getHours() * 60 + now.value.getMinutes()

    return (
      currentMinutes >= openHour * 60 + openMin &&
      currentMinutes < closeHour * 60 + closeMin
    )
  })

  const label = computed(() => (isOpen.value ? 'Open now' : 'Closed'))

  return { isOpen, label }
}
`,

'app/composables/useCampaign.ts': `export function useCampaign() {
  const route = useRoute()
  const { locale } = useI18n()

  const utmSource = computed(() => (route.query.utm_source as string) || 'qr_exit')
  const offerSlug = computed(() => (route.query.offer as string) || null)

  const { data, pending, error } = useFetch(
    () => \`/api/campaigns/\${utmSource.value}\`,
    {
      query: computed(() => ({
        audience: 'monkey_forest_guest',
        offer: offerSlug.value,
        locale: locale.value,
      })),
      key: computed(() => \`campaign-\${utmSource.value}-\${locale.value}\`),
    }
  )

  const offer = computed(() => data.value?.offer ?? null)
  const code = computed(() => data.value?.code ?? null)

  return { offer, code, utmSource, offerSlug, pending, error }
}
`,

'app/composables/useTrackEvent.ts': `export function useTrackEvent(
  eventName: string,
  payload: Record<string, unknown> = {}
) {
  if (import.meta.dev) {
    console.log(\`[analytics] \${eventName}\`, payload)
    return
  }

  if (typeof window !== 'undefined' && (window as any).plausible) {
    (window as any).plausible(eventName, { props: payload })
  }
}
`,

const props = withDefaults(defineProps<{
  src?: string | null
  alt: string
  fallback?: string
}>(), {
  fallback: '/images/placeholder.svg',
})

const failed = ref(false)

const resolvedSrc = computed(() =>
  !props.src || failed.value ? props.fallback : props.src
)

function handleError() {
  failed.value = true
  if (import.meta.dev) {
    console.warn(\`[AppImage] missing asset: \${props.src} — using fallback\`)
  }
}
<\/script>

<template>

const props = defineProps<{
  discountLabel: string
  whatsappUrl: string
}>()

const emit = defineEmits<{ 'claim-click': [] }>()

const visible = ref(true)
let lastScroll = 0

function onScroll() {
  const y = window.scrollY
  if (window.innerWidth >= 768) {
    visible.value = !(y < lastScroll && y > 400)
  }
  lastScroll = y
}

onMounted(() => window.addEventListener('scroll', onScroll, { passive: true }))
onUnmounted(() => window.removeEventListener('scroll', onScroll))

'app/components/campaign/FloatingWhatsApp.vue': `<script setup lang="ts">
const props = withDefaults(
  defineProps<{
    whatsappUrl: string
    visibleAfter?: number
  }>(),
  { visibleAfter: 600 }
)

const emit = defineEmits<{ 'claim-click': [] }>()
const show = ref(false)

function onScroll() {
  show.value = window.scrollY > props.visibleAfter
}

onMounted(() => window.addEventListener('scroll', onScroll, { passive: true }))
onUnmounted(() => window.removeEventListener('scroll', onScroll))
<\/script>

<template>
  <a

    :href="whatsappUrl"

Files for the /after-monkey-forest campaign funnel.

## Setup

1. Copy every folder into your Nuxt 4 project root.
2. Add to nuxt.config.ts:

   runtimeConfig: { public: { whatsappPhone: '6281805444270' } }
3. Run: pnpm dev
4. Visit: http://localhost:3000/after-monkey-forest?utm_source=qr_exit

## Structure

- assets/css/theme.css          — global CSS variables
- app/composables/              — 4 reusable logic modules
- app/components/base/          — AppImage, AppButton
- app/components/campaign/      — 11 funnel blocks
- app/pages/                    — the /after-monkey-forest route
- i18n/                         — EN + ID translations
- public/images/                — placeholder + docs
- docs/ASSETS.md                — image specs

1. Create MikroORM entities (promotion, promotion_category, promotion_code, etc.)
2. Run the migration
3. Seed the "Sanctuary Cool-Down Combo"
4. Create the API endpoints

  const status = document.getElementById('status');

  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> Building zip...';
  status.className = 'status show';
  status.textContent = 'Zipping ' + Object.keys(files).length + ' files...';

  try {
    if (typeof JSZip === 'undefined') {
      throw new Error('JSZip failed to load. Check your internet connection and reload the page.');
    }

    const zip = new JSZip();

    Object.entries(files).forEach(([path, content]) => {
      zip.file(path, content);
    });

    // Add empty server directories via placeholder files
    zip.file('server/api/.gitkeep', '');
    zip.file('server/database/entities/.gitkeep', '');
    zip.file('server/database/migrations/.gitkeep', '');
    zip.file('server/database/seeders/.gitkeep', '');

    const blob = await zip.generateAsync({ type: 'blob' });

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'campaign-files.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    status.textContent = '✅ Done! campaign-files.zip has been downloaded.';
    btn.innerHTML = '<span>✅</span> Downloaded — click to download again';
  } catch (err) {
    status.className = 'status show error';
    status.textContent = '❌ Error: ' + err.message;
    btn.innerHTML = '<span>📦</span> Try again';
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
